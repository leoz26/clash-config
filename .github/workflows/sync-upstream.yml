name: sync-upstream

on:
  schedule:
    - cron: "0 0 * * 1"        # 每周一 00:00 UTC = 北京时间 08:00
  workflow_dispatch:            # GitHub 网页上手动触发（Actions → Sync upstream → Run workflow）
  push:
    paths: ["overrides.ini"]    # 改完 overrides.ini 立即重新生成成品

permissions:
  contents: write

env:
  UPSTREAM_URL: https://raw.githubusercontent.com/usbog232/clashmetadingyue/main/metafenliu.ini

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 下载上游最新 metafenliu.ini
        run: |
          curl -fsSL "$UPSTREAM_URL" -o upstream.ini
          echo "上游原版 $(wc -l < upstream.ini) 行"

      - name: 应用 overrides.ini 生成成品
        id: apply
        continue-on-error: true      # 有改动没生效也继续推送，最后再报错提醒
        run: |
          python3 apply_overrides.py
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: 校验成品
        run: |
          grep -q '^\[custom\]' metafenliu.ini || { echo "::error::成品缺少 [custom] 段"; exit 1; }
          echo "成品 $(wc -l < metafenliu.ini) 行，校验通过"

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "上游和改动都没有变化，不产生空提交"
          else
            git commit -m "chore: 同步上游 metafenliu.ini $(date -u +%Y-%m-%d)"
            git push
            echo "已推送，订阅地址见仓库 README"
          fi

      - name: 改动是否全部生效
        if: steps.apply.outputs.rc != '0'
        run: |
          echo "::error::有 overrides.ini 的改动没匹配上（上游把那行改了或删了）。"
          echo "::error::请打开 metafenliu.ini 找到对应位置，更新 overrides.ini 里的关键字，然后手动重跑本 workflow。"
          exit 1
