; ==========================================================
; 我的个性化改动（自动同步时打到最新上游 metafenliu.ini 上）
;
; 每行一条，; 或 # 开头是注释。支持 6 种写法：
;   set <关键字> => <新的整行>     把「包含关键字」的整行替换掉
;   sub <关键字> => <新文本>       在「包含关键字」的行里，把关键字换成新文本
;   drop <关键字>                  删除所有包含关键字的行
;   append <新的整行>              文件末尾追加一行
;   after <关键字> => <新的整行>   在最后一个包含关键字的行之后插入一行
;   before <关键字> => <新的整行>  在第一个包含关键字的行之前插入一行
;
; 「关键字」是包含匹配，不用写整行，写你能认出的那一小段就行。
; 在 GitHub 网页上改完这个文件，会自动重新生成 metafenliu.ini（约几秒）；
; 也可以去 Actions → Sync upstream → Run workflow 手动触发。
; ==========================================================

; ---------- 示例（把行首的 ; 去掉就会生效，按需修改） ----------

; 1) 换测速地址（上游默认 https://www.gstatic.com/generate_204）
; sub https://www.gstatic.com/generate_204 => http://cp.cloudflare.com/generate_204

; 2) 屏蔽 Disney+（会替换掉 Adobe 那一行，按需改）
; set ruleset=🟥 Adobe,[]GEOSITE,adobe => ruleset=🎬 Disney,[]GEOSITE,disney

; 3) 在「漏网之鱼」之前插入一条国内游戏直连规则
; before ruleset=🐟 漏网之鱼,[]FINAL => ruleset=DIRECT,[]GEOSITE,category-games@cn

; 4) 去掉 exclude 里的某个关键词（比如不想过滤「频道」）
; sub |频道| => |

; 5) 文件末尾追加一行
; append ; 我的备注

; ---------- 我的改动写在这里 ----------

; 6) 我自己的域名 / DDNS 一律直连
;    DOMAIN-SUFFIX 自带子域名，所以 sthho.cc.cd 这一条就覆盖了 www.sthho.cc.cd
before ruleset=DIRECT,[]GEOSITE,private => ruleset=DIRECT,[]DOMAIN-SUFFIX,5588058.xyz
before ruleset=DIRECT,[]GEOSITE,private => ruleset=DIRECT,[]DOMAIN-SUFFIX,leoz26.ccwu.cc
before ruleset=DIRECT,[]GEOSITE,private => ruleset=DIRECT,[]DOMAIN-SUFFIX,leoz26.dpdns.org
before ruleset=DIRECT,[]GEOSITE,private => ruleset=DIRECT,[]DOMAIN-SUFFIX,luoshihao.cloudns.ch
before ruleset=DIRECT,[]GEOSITE,private => ruleset=DIRECT,[]DOMAIN-SUFFIX,sthho.cc.cd
